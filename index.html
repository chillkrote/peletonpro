<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PelotonPro – Dein Radsport-Portal</title>
    <meta name="description" content="Races, Teams und News der UCI World Tour auf einen Blick.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Roboto+Condensed:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <div class="home-bg" aria-hidden="true"></div>
    <div id="site-nav" class="topnav"></div>

    <main>
        <section class="hero">
            <h1>Dein Radsport-Portal</h1>
        </section>

        <div class="tiles">
            <a href="races.html" class="tile tile-races">
                <div class="icon-wrap"><i class="fas fa-flag-checkered"></i></div>
                <div class="bignum" id="tile-races-count">–</div>
                <h2>Races</h2>
                <p>Kalender, laufende Rennen &amp; Ergebnisse</p>
                <span class="go">Ansehen <i class="fas fa-chevron-right"></i></span>
            </a>
            <a href="teams.html" class="tile tile-teams">
                <div class="icon-wrap"><i class="fas fa-users"></i></div>
                <div class="bignum" id="tile-teams-count">–</div>
                <h2>Teams &amp; Fahrer</h2>
                <p>Kader, Team-Wechsel-Historie &amp; Fahrerprofile der World Tour</p>
                <span class="go">Ansehen <i class="fas fa-chevron-right"></i></span>
            </a>
            <a href="news.html" class="tile tile-news">
                <div class="icon-wrap"><i class="fas fa-newspaper"></i></div>
                <div class="bignum" id="tile-news-count">–</div>
                <h2>News</h2>
                <p>Die neuesten Radsport-Schlagzeilen</p>
                <span class="go">Ansehen <i class="fas fa-chevron-right"></i></span>
            </a>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 PelotonPro · <a href="#">Impressum</a> · <a href="#">Datenschutz</a></p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
